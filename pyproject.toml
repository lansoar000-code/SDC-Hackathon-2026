[project]
name = "prepwise"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "openpyxl==3.1.5",
    "python-multipart==0.0.32",
    "ruff==0.17.1",
    "uvicorn>=0.54.0",
    "xgboost==3.4.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"forecasting/step*.py" = ["E402"]
